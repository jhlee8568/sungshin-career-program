<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%236348AE'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sunshine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Sunshine: 밝은 바탕 + 햇빛색 원 + 글래스(반투명·블러·밝은 테두리) 버튼. 색은 토큰으로만 쓴다. */
:root{--bg:#F3F4FB;--ink:#16181d;--mut:#6c7079;--line:#16181d;--hair:rgba(22,24,29,.12);--g1:#e9eaf6;--g2:#dcdeef;--no:#c8452f;
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--gbrd:rgba(255,255,255,.75);--ghi:rgba(255,255,255,.95);--gsh:rgba(60,45,110,.14);
--sun1:#ebe6f8;--sun2:#7d64c9;--sun3:#6348AE;--sun4:#d8cff0;--on:#6348AE;--onink:#fff;--tagink:#4a3590}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121317;--ink:#f1f1ee;--mut:#a0a4ac;--line:#f1f1ee;--hair:rgba(255,255,255,.14);--g1:#1c1d22;--g2:#2a2b31;--no:#ff9c8a;
--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--gbrd:rgba(255,255,255,.18);--ghi:rgba(255,255,255,.28);--gsh:rgba(0,0,0,.4);
--sun1:#3a3354;--sun2:#a99bdc;--sun3:#9a8bd0;--sun4:#2e2942;--on:#a99bdc;--onink:#16181d;--tagink:#ece8f8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121317;--ink:#f1f1ee;--mut:#a0a4ac;--line:#f1f1ee;--hair:rgba(255,255,255,.14);--g1:#1c1d22;--g2:#2a2b31;--no:#ff9c8a;
--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--gbrd:rgba(255,255,255,.18);--ghi:rgba(255,255,255,.28);--gsh:rgba(0,0,0,.4);
--sun1:#3a3354;--sun2:#a99bdc;--sun3:#9a8bd0;--sun4:#2e2942;--on:#a99bdc;--onink:#16181d;--tagink:#ece8f8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* 글래스 공통 */
.glass,.btn,.tile,.chip,.sel,.pop,.blk,.cond,.subp,.find,.refbtn,.p .lnk,.sheet{
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),0 10px 30px -12px var(--gsh)}
.btn,.tile,.chip,.sel,.refbtn,.p .lnk{cursor:pointer;transition:transform .15s ease,background .15s ease}
.btn:hover:not(:disabled),.tile:hover,.chip:hover,.sel:hover,.refbtn:hover,.p .lnk:hover{background:var(--glass2)}
.btn:active:not(:disabled),.tile:active,.chip:active,.sel:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.btn,.tile,.chip,.sel,.refbtn,.p .lnk{transition:none}}

/* 배경 원 */
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgfx{background:radial-gradient(1100px 760px at 100% 0%,color-mix(in srgb,var(--sun3) 9%,transparent),transparent 70%)}
.bgfx i{display:none}

/* 틀: 왼쪽 서비스명·제목·설명, 오른쪽 선택지와 결과 */
.app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(280px,36%) minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start;gap:44px 56px;max-width:1280px;margin:0 auto;min-height:100vh;padding-block:28px 140px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:44px}
.brand{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-family:"Outfit",-apple-system,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1}
.side{position:sticky;top:36px;align-self:start;display:flex;flex-direction:column;gap:22px;min-width:0}
.ttl{font-size:clamp(32px,3.7vw,52px);font-weight:700;line-height:1.16;letter-spacing:-.03em;margin:0;text-wrap:balance;word-break:keep-all}
.desc{font-size:16.5px;line-height:1.65;color:var(--mut);margin:0;max-width:30em;word-break:keep-all}
.main{display:flex;flex-direction:column;gap:26px;min-width:0}
/* 단계 표시: 오른쪽 위 */
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps .st{display:inline-flex;align-items:baseline;gap:6px;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mut);background:transparent;border:1px solid var(--hair);text-align:left}
.steps .st .no{font-family:"Outfit",sans-serif;font-size:11.5px;font-variant-numeric:tabular-nums}
.steps .st .sv{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
.steps .st .sv:empty{display:none}
.steps button.st{cursor:pointer;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-color:var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi)}
.steps button.st:hover{background:var(--glass2)}
.steps .st.now{background:var(--on);color:var(--onink);border-color:transparent;font-weight:600}
/* 이전·다음·시작하기: 오른쪽 아래 고정 */
.nav{position:fixed;z-index:15;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:max(28px,calc((100vw - 1280px)/2 + 28px));display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),0 18px 44px -16px var(--gsh)}
.nav:empty,.cta:empty{display:none}
.cta{margin-top:10px}
.cta .btn{padding:15px 36px;font-size:17px}
.nav:has(> .btn:only-child){background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:transparent;box-shadow:none;padding:0}
.nav:has(> .btn:only-child) .btn{box-shadow:0 14px 32px -12px var(--gsh)}
.nav .btn{box-shadow:none}
.nav .hint{font-variant-numeric:tabular-nums;padding:0 6px}
.btn{font-size:16px;font-weight:600;border-radius:999px;padding:13px 30px}
.btn.pri{background:var(--on);color:var(--onink);border-color:transparent;box-shadow:0 10px 26px -10px var(--gsh)}
.btn.pri:hover:not(:disabled){background:var(--on);opacity:.88}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-size:13.5px;color:var(--mut)}

.scr{display:flex;flex-direction:column;gap:26px;min-width:0}
.q{font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{font-size:16px;color:var(--mut);margin:-14px 0 0}

/* 학과 선택 */
.combo{position:relative;max-width:520px;z-index:5}
.sel{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:19px;font-weight:600;border-radius:999px;padding:18px 26px;text-align:left}
.sel .ph{color:var(--mut);font-weight:500}
.sel .cv{width:10px;height:10px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translate(-2px,-2px);flex:none;transition:transform .15s ease}
.sel[aria-expanded="true"] .cv{transform:rotate(225deg) translate(-2px,-2px)}
.pop{position:absolute;left:0;right:0;top:calc(100% + 10px);border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--glass2);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);box-shadow:inset 0 1px 0 var(--ghi),0 24px 60px -18px var(--gsh)}
.find{font:inherit;font-size:16px;width:100%;color:var(--ink);border-radius:999px;padding:12px 18px;box-shadow:inset 0 1px 0 var(--ghi)}
.find::placeholder{color:var(--mut)}
.find:focus-visible{outline:none;border-color:var(--sun2);box-shadow:inset 0 1px 0 var(--ghi),0 0 0 3px color-mix(in srgb,var(--sun2) 45%,transparent)}
#deplist{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:2px}
.gl{font-size:12px;font-weight:600;color:var(--mut);margin:10px 12px 4px}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;background:none;border:0;border-radius:14px;padding:10px 12px;text-align:left;font-size:16px;cursor:pointer}
.opt small{font-size:12.5px;color:var(--mut);white-space:nowrap}
.opt:hover,.opt:focus-visible{background:var(--hair)}
.opt[aria-pressed="true"]{background:var(--on);color:var(--onink)}
.opt[aria-pressed="true"] small{color:var(--onink);opacity:.7}

/* 선배 활동 원 (학과 화면 그림) */
.orbs{position:relative;height:440px}
.orb{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;gap:2px;border:1px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),0 18px 40px -18px var(--gsh)}
.orb b{font-size:15.5px;font-weight:600;line-height:1.25}
.orb span{font-family:"Outfit",-apple-system,sans-serif;font-size:34px;font-weight:600;line-height:1.1}
.orb.a{width:220px;height:220px;left:2%;top:10px;background:#ffd166;color:#16181d}
.orb.b{width:176px;height:176px;left:36%;top:126px;background:#ffb36b;color:#16181d}
.orb.c{width:196px;height:196px;left:61%;top:0;background:#f3dcc4;color:#16181d}
.orb.d{width:156px;height:156px;left:8%;top:262px;background:#ff8f70;color:#16181d}
.orb.e{width:160px;height:160px;left:66%;top:230px;background:var(--glass2);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}


/* 선택지 */
.grid{display:grid;gap:12px}
.c4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.c3{grid-template-columns:repeat(3,1fr)}.c5{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.tile{font-size:15.5px;font-weight:500;text-align:left;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile small{font-size:12.5px;font-weight:400;color:var(--mut)}
.tile[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:transparent}
.tile[aria-pressed="true"] small{color:var(--onink);opacity:.72}
.tile.big{font-size:22px;font-weight:700;padding:40px 14px;align-items:center;text-align:center;border-radius:30px}
.tile.dim{border-style:dashed;border-color:var(--hair)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:16px;font-weight:500;border-radius:999px;padding:13px 22px}
.grid.dense{grid-auto-flow:row dense}
.subp{grid-column:1/-1;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--glass2)}
.subp .gl{margin:0 4px}
.subp .tile{padding:12px 14px;font-size:14.5px;border-radius:18px}

/* 추천 결과 */
.cond{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14.5px;border-radius:22px;padding:14px 20px}
.cond b{flex:1;font-weight:600;min-width:200px}
.lk{font-size:14px;background:none;border:0;border-bottom:1px solid var(--ink);padding:0;cursor:pointer}
.blks{display:flex;flex-direction:column;gap:20px}
.blk{display:flex;flex-direction:column;gap:12px;border-radius:30px;padding:22px 24px}
.rows{display:flex;flex-direction:column}
.row{text-align:left;background:none;border:0;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;padding:0}
.row .rk{font-family:"Outfit",-apple-system,sans-serif;font-size:40px;font-weight:600;line-height:1}
.row .nm{font-size:19px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:8px;letter-spacing:-.01em}
.row .wy{font-size:14px;color:var(--mut);margin-top:3px;display:block}
.row .go{font-size:13.5px;white-space:nowrap;color:var(--mut)}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--sun1);color:var(--tagink)}
details{font-size:13.5px}
details summary{cursor:pointer;color:var(--mut)}
.calc{margin-top:8px;font-variant-numeric:tabular-nums;border-left:2px solid var(--hair);padding-left:12px;line-height:1.8}
.h3{font-size:19px;font-weight:700;margin:8px 0 -10px}
.pl{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.p{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--hair)}
.p .pn{flex:1;min-width:0;font-size:15.5px;font-weight:500}
.p .wh{display:block;font-size:12.5px;font-weight:400;color:var(--mut);margin-top:3px}
.p .lnk{font-size:13.5px;font-weight:600;border-radius:999px;padding:8px 16px;flex:none;text-decoration:none;white-space:nowrap;color:var(--ink)}
.morebtn{align-self:center;margin:2px 0;font-size:14px;padding:10px 22px}
.none{color:var(--no);font-weight:600}
.empty{border:1px dashed var(--hair);border-radius:20px;padding:28px 16px;text-align:center;color:var(--mut);font-size:15px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{border:1px solid var(--hair);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-size:46px;font-weight:700;line-height:1.05}
.bar{height:8px;border-radius:8px;background:var(--g2);position:relative;margin-top:6px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--ink)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}

/* 구조도 (참고용, 오른쪽 위 버튼) */
.refs{display:flex;gap:8px}
.refbtn{text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;border-radius:999px;padding:9px 18px}
.sheetwrap{position:fixed;inset:0;z-index:30;overflow:auto;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sheet{max-width:1040px;margin:0 auto;border-radius:30px;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .hd b{font-size:17px}
figure{margin:0}
.figbox{overflow-x:auto}
.figbox svg{display:block;width:100%;min-width:760px;max-width:980px;height:auto;margin:0 auto}
figcaption{max-width:980px;margin:12px auto 0;font-size:13px;color:var(--mut)}
figcaption b{color:var(--ink)}
svg text{font-family:inherit;fill:var(--ink)}
.bx{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.pr{fill:var(--g1);stroke:var(--line);stroke-width:1.2}
.ln{fill:none;stroke:var(--line);stroke-width:1.2}
.hr{stroke:var(--hair);stroke-width:1}
.ah{fill:var(--line)}
.nobx{fill:var(--bg);stroke:var(--no);stroke-width:1.2;stroke-dasharray:5 4}
.noln{fill:none;stroke:var(--no);stroke-width:1.2;stroke-dasharray:5 4}
.noah{fill:var(--no)}
svg .tno{fill:var(--no)}
.t{font-size:14px;font-weight:600}
.s{font-size:12px}
svg .m{fill:var(--mut)}
.h{font-size:12px;font-weight:700;letter-spacing:.04em}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:none;align-content:start;min-height:0;gap:20px;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side{position:static;gap:12px}
  .top{min-height:0}
  .refbtn{padding:8px 14px;font-size:13px}
  .brand{font-size:21px}
  .ttl{font-size:30px}
  .desc{font-size:15px}
  .cta .btn{width:100%}
  .steps{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 0;padding-right:16px}
  .steps .st{flex:none}
  .combo{max-width:none}
  .nav{right:max(16px,env(safe-area-inset-right,0px))}
  .nav .btn{padding:12px 22px}
  .orbs{height:330px;transform-origin:left top}
  .orb.a{width:150px;height:150px}.orb.b{width:124px;height:124px;top:96px;left:38%}.orb.c{width:132px;height:132px;left:62%}.orb.d{width:112px;height:112px;top:190px}.orb.e{width:118px;height:118px;top:180px;left:62%}
  .orb span{font-size:22px}.orb b{font-size:12.5px}
  .row{grid-template-columns:40px 1fr}.row .go{grid-column:2}
  .p{flex-wrap:wrap}
  .stat2{grid-template-columns:1fr}
}
</style>

<div class="bgfx" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>
<div class="app" id="pn-wireframe">
  <header class="top"><button type="button" class="brand" data-a="home" aria-label="Sunshine 처음으로">Sunshine</button><div class="refs"><a class="refbtn" href="algorithm.html">구조도</a><a class="refbtn" href="wireframe.html#wireframe">와이어프레임</a></div></header>
  <aside class="side">
    <h1 class="ttl" id="ttl"></h1>
    <p class="desc" id="desc"></p>
    <div class="cta" id="cta"></div>
  </aside>
  <main class="main">
    <div class="steps" id="steps" hidden></div>
    <div class="scr" id="scr"></div>
  </main>
  <div class="nav" id="nav"></div>
</div>
<div class="sheetwrap" id="pn-structure" hidden>
  <div class="sheet">
    <div class="hd"><b>구조도 (참고용)</b><button type="button" class="btn" id="refclose">닫기</button></div>
    <figure>
      <div class="figbox">
      <svg viewBox="0 0 920 770" role="img" aria-label="학과와 희망 직무로 GOMS에서 비슷한 선배를 찾고, 진로 고민을 반영해 활동 순위를 계산한 뒤, 학년, 학과, 프로그램 참여 방식에 맞는 선샤인 프로그램을 붙여 결과 화면으로 보여 준다">
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="ah"/></marker>
          <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="noah"/></marker>
        </defs>
        <text x="20" y="24" class="h">입력</text><text x="310" y="24" class="h">추천 계산</text><text x="710" y="24" class="h">데이터</text>

        <rect x="20" y="40" width="190" height="56" class="bx"/><text x="32" y="62" class="s m">학과</text><text x="32" y="83" class="t">서비스디자인공학과</text>

const KW=[["AI·데이터","AI|데이터|Analytics|SQL|Pytorch|딥러닝"],["코딩·개발","코딩|JAVA|C\\+\\+|프로그래밍|개발자|SQL|Pytorch"],["공기업·공공기관","공기업|공단|공사|NCS|발전|한국전력|한전|수력원자력|심사평가원|근로복지"],["대기업","대기업|삼성|LG|SK|현대|롯데|CJ|포스코|GS|KT|두산|효성|이랜드|GSAT"],["금융·은행","은행|금융|농협|핀테크|경제"],["외국계·글로벌","외국계|글로벌|Global|국제|Microsoft|Google|English|통번역|외국인"],["마케팅·콘텐츠","마케팅|콘텐츠|브랜드|Brand|크리에이터|광고"],["디자인·포트폴리오","포트폴리오|디자인|포토샵|프리미어|ARTDAYS|큐레이터|노션"],["교직·교육","교사|교직|교육학과|유아교육|사회교육|사범"],["간호·의료·바이오","간호|의료|바이오|PRN|메디컬"],["자격증","자격|SQLD|AdSP|Certificate|기사 "],["현장실습·기업탐방","현장실습|인턴|기업탐방|사전직무"],["선배·현직자 멘토링","멘토|선배|졸업생|현직자|의 밤"],["면접","면접"],["자기소개서","자소서|자기소개서|이력서"],["진로 탐색·심리검사","검사|MBTI|TCI|진로탐색|진로 탐색|진로탐구|직무의 탐색|직무안내|직무분석"]].map(k=>[k[0],new RegExp(k[1])]);
const WO=[["뭘 하고 싶은지 아직 모르겠어요", ["직업심리검사", "진로 상담"]], ["전공이나 복수전공을 먼저 정해야 해요", ["진로·취업 교과목", "진로 상담"]], ["선배들은 진로를 어떻게 정했는지 궁금해요", ["대외활동", "취업캠프·스터디"]], ["지금 고른 진로가 나한테 맞는지 확인하고 싶어요", ["직장체험(인턴 포함)", "대외활동"]], ["진로를 생각하면 불안하고 의욕이 없어요", ["진로 상담"]], ["이제 본격적으로 취업 준비를 하고 싶어요", ["자격증 준비", "취업 관련 서류 작성 교육", "(모의)면접 준비", "기업체 직무적성검사 준비"]]];
const K=20, W_RATE=2, W_WORRY=0.3, W_KEY=0, W_ROAD=0.2;  /* 관심 키워드 단계 삭제(2026-11-20): 가점 없음 */
const kwOf=(p,q)=>KW.filter(k=>q.keys&&q.keys[k[0]]&&k[1].test(p.n)&&!(k[0]==='진로 탐색·심리검사'&&/직무적성검사/.test(p.n))).map(k=>k[0]);

function recommend(q){
  const dp=D.dep.find(x=>x[1]===q.dep), major=dp?dp[2]:null, dpm=dp?dp[3]:null, job=q.job&&q.job!=='?'?q.job:null, sub=job&&q.sub?q.sub:null;
  /* 비슷한 선배 후보: 넓은 범위 → 좁은 범위 순서. 선배 30명 이상인 가장 좁은 범위를 화면에 표시 */
  const chain=[];
  if(job){
    chain.push(['J:'+job,job]); if(sub) chain.push(['S:'+sub,sub]);
    if(major){chain.push(['JM:'+job+'|'+major,major+' 계열 · '+job]); if(sub) chain.push(['SM:'+sub+'|'+major,major+' 계열 · '+sub]);}
    if(dpm){chain.push(['JD:'+job+'|'+dpm,dpm+' 전공 · '+job]); if(sub) chain.push(['SD:'+sub+'|'+dpm,dpm+' 전공 · '+sub]);}
  } else { if(major) chain.push(['M:'+major,major+' 계열']); if(dpm) chain.push(['D:'+dpm,dpm+' 전공']); }
  const worryOf=t=>WO.filter(w=>q.worries&&q.worries[w[0]]&&w[1].includes(t)).map(w=>w[0]);
  const out=[], skipped=[];
  let grp=D.stat.A, grpName='서울권 4년제 졸업생 전체';
  chain.forEach(([k,nm])=>{const s=D.stat[k]; if(s&&s[D.res[9]][0]>=30){grp=s; grpName=nm;}});
  const grpN=grp[D.res[9]][0];
  D.res.forEach(t=>{
    const A=D.stat.A[t], rAll=A[1]/A[0];
    if(t==='어학연수'){skipped.push({t,why:'GOMS에 도움 점수가 없어 순위를 낼 수 없음'});return;}
    let h=A[2]/A[3], r=rAll;
    chain.forEach(([k])=>{const s=D.stat[k]&&D.stat[k][t]; if(s){r=(s[1]+K*r)/(s[0]+K); h=(s[2]+K*h)/(s[3]+K);}});
    const g=grp[t], rawRate=g[0]?g[1]/g[0]:0, rawHelp=g[3]?g[2]/g[3]:null;
    const worry=worryOf(t), kwN=programs(t,q).kw, road=(ROAD[q.grade]||[]).includes(t);
    const score=h+W_RATE*(r-rAll)+(worry.length?W_WORRY:0)+(kwN?W_KEY:0)+(road?W_ROAD:0);
    out.push({t,score,h,r,rAll,rawRate,rawHelp,den:g[0],n:g[1],cnt:g[3],worry,kwN,road});
  });
  out.sort((a,b)=>b.score-a.score);
  return {list:out,skipped,grpName,grpN,major,job,jobLabel:sub||job,dp};
}
const norm=s=>s.replace(/[·\s]/g,'').replace(/\(.*\)/,'');
/* 프로그램 참여 방식: 시트 '0_선샤인 프로그램'의 "프로그램 형태" 값. [화면 이름, 시트 값들] */
const FM=[['이러닝 (온라인 강의)',['이러닝']],['온라인검사',['온라인검사']],['이론강의',['이론강의']],['실습강의 (이론+실습 포함)',['이론+실습강의','실습강의']],['멘토링',['멘토링']],['상담',['상담']],['스터디',['스터디']],['현장실습',['현장실습','설명회']]];
const fmOf=(p,q)=>FM.some(f=>(q.forms||{})[f[0]]&&f[1].includes(p.f));
function programs(t,q){
  const dp=D.dep.find(x=>x[1]===q.dep), mine=[], gen=[]; let other=0;
  D.prog.forEach(p=>{
    if(p.t!==t) return;
    const grad=p.area==='졸업생 특화프로그램';
    if(grad&&q.grade!=='졸업생'){other++;return;}
    const o=Object.assign({},p,{k:kwOf(p,q),fm:fmOf(p,q)});
    if(!p.d){(grad?mine:gen).push(o);return;}
    const pd=norm(p.d);
    if(dp&&(pd.includes(norm(dp[1]))||pd===norm(dp[0]))) mine.push(o); else other++;
  });
  const m=p=>(p.k.length>0)+(p.fm?1:0), byK=(a,b)=>m(b)-m(a);  /* 프로그램 참여 방식에 맞는 프로그램을 앞으로 */
  mine.sort(byK); gen.sort(byK);
  const list=mine.concat(gen);
  return {list,mine:mine.length,other,kw:list.filter(p=>p.k.length).length};
}
const pct=x=>Math.round(x*100)+'%';

const STEPS=['학과','학년','희망 직무','진로 고민','프로그램 참여 방식','추천 결과'];
const st={scr:0,back:'rank',q:'',ini:'',college:'',dep:'',job:'',sub:'',grade:'',keys:{},worries:{},forms:{},fav:{},more:{},detail:null,all:false,open:false};
const CHO='ㄱㄱㄴㄷㄷㄹㅁㅂㅂㅅㅅㅇㅈㅈㅊㅋㅌㅍㅎ', INI=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','A-Z'];
function cho(s){return [...s].map(ch=>{const c=ch.charCodeAt(0);return c>=0xAC00&&c<=0xD7A3?CHO[Math.floor((c-0xAC00)/588)]:ch;}).join('');}
const DEPS=D.dep.map(d=>{const c=cho(d[1]);return {col:d[0],name:d[1],cho:c.replace(/[^ㄱ-ㅎA-Za-z]/g,''),ini:/[ㄱ-ㅎ]/.test(c[0])?c[0]:'A-Z'};}).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
function depList(){
  const q=st.q.replace(/\s/g,''), onlyCho=q&&/^[ㄱ-ㅎ]+$/.test(q);
  const hit=DEPS.filter(d=>!q||(onlyCho?d.cho.includes(q.replace(/[ㄲㄸㅃㅆㅉ]/g,m=>({'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'}[m]))):d.name.replace(/\s/g,'').toLowerCase().includes(q.toLowerCase())));
  if(!hit.length) return '<div class="hint" style="padding:10px 12px">"'+esc(st.q)+'"에 맞는 학과가 없어요.</div>';
  const opt=(d,col)=>'<button type="button" class="opt" role="option" data-a="dep" data-v="'+esc(d.name)+'" aria-pressed="'+(st.dep===d.name)+'">'+esc(d.name)+(col?'<small>'+esc(d.col)+'</small>':'')+'</button>';

}

      '<button type="button" class="tile" data-a="sub" data-v="" aria-pressed="'+(!st.sub)+'">전체<small>선배 '+J[1].toLocaleString()+'명</small></button>'+
      J[2].map(s=>'<button type="button" class="tile" data-a="sub" data-v="'+esc(s[0])+'" aria-pressed="'+(st.sub===s[0])+'">'+esc(s[0])+'<small>선배 '+s[1].toLocaleString()+'명</small></button>').join('')+'</div></div>':'';
    T='어떤 일을 하고 싶나요?'; S='숫자는 그 일을 하고 있는 서울권 4년제 졸업 선배 수예요(2016~2019년 조사). 점선은 30명 미만이에요.'; h=
      '<div class="grid c4 dense"><button type="button" class="tile" data-a="job" data-v="?" aria-pressed="'+(st.job==='?')+'">아직 모름<small>같은 전공 선배 전체로 계산</small></button>'+
      D.jobs.map(j=>'<button type="button" class="tile'+(j[1]<30?' dim':'')+'" data-a="job" data-v="'+esc(j[0])+'" aria-pressed="'+(st.job===j[0])+'">'+esc(j[0])+'<small>선배 '+j[1].toLocaleString()+'명'+'</small></button>').join('')+'</div>';
    nav=navStd(3);
  } else if(st.scr===2){
    T='지금 몇 학년인가요?'; S='학년에 맞는 프로그램을 먼저 보여 줘요.'; h=
      '<div class="grid c5">'+['1학년','2학년','3학년','4학년','졸업생'].map(g=>'<button type="button" class="tile big" data-a="grade" data-v="'+g+'" aria-pressed="'+(st.grade===g)+'">'+g+'</button>').join('')+'</div>';
    nav=navStd(2);
  } else if(st.scr===4){
    T='지금 어떤 고민이 있나요?'; S='여러 개 골라도 돼요. 고른 고민과 관련된 활동을 순위에서 올려 줘요. 없으면 바로 넘어가도 돼요.'; h=
      '<div class="chips">'+WO.map(w=>'<button type="button" class="chip" data-a="worry" data-v="'+esc(w[0])+'" aria-pressed="'+(!!st.worries[w[0]])+'">'+esc(w[0])+'</button>').join('')+'</div>';
    nav=navStd(4);
  } else if(st.scr===5){
    T='어떤 방식으로 참여하고 싶나요?'; S='여러 개 골라도 돼요. 고른 방식의 프로그램을 먼저 보여 줘요. 없으면 바로 넘어가도 돼요.'; h=
      '<div class="chips">'+FM.map(f=>'<button type="button" class="chip" data-a="form" data-v="'+esc(f[0])+'" aria-pressed="'+(!!st.forms[f[0]])+'">'+esc(f[0])+'</button>').join('')+'</div>'+
      '<div class="hint">선샤인 프로그램 목록의 "프로그램 형태" 값이에요. 형태가 적혀 있지 않은 프로그램도 있어요.</div>';
    nav=navStd(5);
  } else if(st.scr==='rank'){
    const R=recommend(st), list=st.all?R.list:R.list.slice(0,5);
    T='선배들은 이 활동이 도움 됐다고 했어요'; S=''; h=
      (S=esc(condText())+'<br>비슷한 선배: '+esc(R.grpName)+' '+R.grpN.toLocaleString()+'명'+(R.grpN<100?' <span class="none">(100명 미만)</span>':''),'')+
      '<div class="blks">'+list.map((a,i)=>{const P=programs(a.t,st);return '<section class="blk"><div class="row"><span class="rk">'+(i+1)+'</span><span><span class="nm">'+esc(lab(a.t))+(a.road?'<span class="tag">'+st.grade+' 로드맵 권장</span>':'')+(a.worry.length?'<span class="tag">내 고민 관련</span>':'')+'</span><span class="wy">비슷한 선배 '+pct(a.rawRate)+'가 했어요 · 도움 점수 '+(a.rawHelp?a.rawHelp.toFixed(2):'-')+'점</span></span><span class="go">'+(P.list.length?'선샤인 프로그램 '+P.list.length+'개':'<span class="none">프로그램 없음</span>')+'</span></div>'+calcBox(a)+progRows(a.t)+'</section>';}).join('')+'</div>';
    if(R.list.length>5) h+='<div><button type="button" class="lk" data-a="all">'+(st.all?'5위까지만 보기':(R.list.length)+'위까지 모두 보기')+'</button></div>';
    if(EXTRA.length) h+='<div class="h3">선배 데이터에는 없지만 선샤인에 있는 활동</div><div class="rows">'+EXTRA.map(t=>{const P=programs(t,st);return '<button type="button" class="row" data-a="detail" data-v="'+esc(t)+'"><span class="rk">–</span><span><span class="nm">'+esc(t)+((ROAD[st.grade]||[]).includes(t)?'<span class="tag">'+st.grade+' 로드맵 권장</span>':'')+'</span><span class="wy">선배 설문에 없는 활동이라 순위를 매기지 않았어요</span></span><span class="go">선샤인 프로그램 '+P.list.length+'개 ›</span></button>';}).join('')+'</div>';
    if(R.skipped.length) h+='<div class="hint">순위에 넣지 못한 활동: '+R.skipped.map(x=>esc(lab(x.t))+' ('+esc(x.why)+')').join(', ')+'</div>';
    nav='<button type="button" class="btn" data-a="go" data-v="5">이전</button><button type="button" class="btn" data-a="reset">처음부터 다시</button>';
  } else if(st.scr==='detail'){
    const R=recommend(st), idx=R.list.findIndex(a=>a.t===st.detail), a=R.list[idx], P=programs(st.detail,st);
    h='<div><button type="button" class="lk" data-a="go" data-v="rank">‹ 순위로 돌아가기</button></div><h2 class="q">'+(a?(idx+1)+'위  ':'')+esc(lab(st.detail))+'</h2>';
    if(a){
      const max=Math.max(a.rawRate,a.rAll,.01)*1.15;
      h+='<div class="stat2"><div class="stat"><span class="n">'+pct(a.rawRate)+'</span><span class="l">비슷한 선배가 이 활동을 했어요</span><div class="bar"><i style="width:'+(a.rawRate/max*100)+'%"></i><u style="left:'+(a.rAll/max*100)+'%"></u></div><span class="d">'+esc(R.grpName)+' '+a.den.toLocaleString()+'명 중 '+a.n.toLocaleString()+'명 · 세로선은 전체 선배 '+pct(a.rAll)+'</span></div>'+
        '<div class="stat"><span class="n">'+(a.rawHelp?a.rawHelp.toFixed(2):'-')+'</span><span class="l">도움 점수 (5점 만점)</span><div class="bar"><i style="width:'+((a.rawHelp||0)/5*100)+'%"></i></div><span class="d">이 활동을 한 선배 '+a.cnt.toLocaleString()+'명이 준 점수의 평균</span></div></div>'+
        '<details><summary>추천 점수 계산 보기 ('+a.score.toFixed(2)+')</summary><div class="calc">도움 점수 '+a.h.toFixed(2)+' (인원이 적으면 전체 평균 쪽으로 보정)<br>참여율 차이 '+(W_RATE*(a.r-a.rAll)>=0?'+':'')+(W_RATE*(a.r-a.rAll)).toFixed(2)+' (비슷한 선배 '+pct(a.r)+' − 전체 '+pct(a.rAll)+', × '+W_RATE+')<br>내 고민 반영 '+(a.worry.length?'+'+W_WORRY.toFixed(2)+' ('+esc(a.worry.join(', '))+')':'+0.00')+'<br>학년 로드맵 '+(a.road?'+'+W_ROAD.toFixed(2):'+0.00')+'</div></details>';
    } else h+='<p class="sub">선배 설문에 없는 활동이에요. 선샤인 프로그램만 보여 줘요.</p>';
    h+='<div class="h3">선샤인 프로그램 '+P.list.length+'개</div>'+progRows(st.detail);
    nav='<button type="button" class="btn" data-a="go" data-v="rank">순위로</button><span></span><span></span>';
  } else if(st.scr==='fav'){
    const ids=Object.keys(st.fav);
    T='관심 프로그램 '+ids.length+'개'; S=''; h=(ids.length?'<div class="pl">'+ids.map(id=>{const p=D.prog.find(x=>x.i==id);return '<div class="p"><span class="pn">'+esc(p.n)+'<span class="wh">'+esc(lab(p.t))+' · 선샤인 메뉴: '+esc(p.tab)+'</span></span><button type="button" data-a="favtoggle" data-v="'+p.i+'" aria-pressed="true">관심 ✓</button></div>';}).join('')+'</div>':'<div class="empty">프로그램에서 "관심"을 누르면 여기에 모여요.</div>');
    nav='<button type="button" class="btn" data-a="go" data-v="'+st.back+'">돌아가기</button><span></span><span></span>';
  }
  $('#scr').innerHTML=h; $('#nav').innerHTML=nav; $('#ttl').textContent=T; $('#desc').innerHTML=S; $('#cta').innerHTML=cta;
  if(st.scr===1&&st.depopen){const i=$('#depq'); if(i&&i.focus) try{i.focus();}catch(e){}}
}
$('#pn-wireframe').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b){ if(st.depopen&&!e.target.closest('.combo')){st.depopen=false; render();} return; }
  if(b.disabled) return;
  if(b.dataset.a==='nolink'){ e.preventDefault(); return; }  /* 링크 연결 전 */
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='ini'){st.ini=v==='전체'?'':v; st.q='';}
  else if(a==='home'){Object.assign(st,{scr:0,depopen:false,q:'',ini:'',college:'',dep:'',job:'',sub:'',grade:'',keys:{},worries:{},forms:{},detail:null,all:false,open:false,more:{}}); scrollTop();}
  else if(a==='depopen'){st.depopen=!st.depopen; st.q='';}
  else if(a==='dep'){st.dep=v; st.depopen=false; st.q=''; st.scr=2; scrollTop();}  /* 학과를 고르면 바로 다음 단계로 */
  else if(a==='job'){st.job=v; st.sub='';}
  else if(a==='sub') st.sub=v;
  else if(a==='grade') st.grade=v;
  else if(a==='key'){ if(st.keys[v]) delete st.keys[v]; else st.keys[v]=1; }
  else if(a==='worry'){ if(st.worries[v]) delete st.worries[v]; else st.worries[v]=1; }
  else if(a==='form'){ if(st.forms[v]) delete st.forms[v]; else st.forms[v]=1; }
  else if(a==='go'){st.scr=/^\d+$/.test(v)?+v:v; st.open=false; st.depopen=st.scr===1&&!st.dep; st.q=''; scrollTop();}
  else if(a==='detail'){st.detail=v; st.scr='detail'; st.open=false; scrollTop();}
  else if(a==='all') st.all=!st.all;
  else if(a==='more'){ if(st.more[v]) delete st.more[v]; else st.more[v]=1; }
  else if(a==='open') st.open=!st.open;
  else if(a==='favtoggle'){ if(st.fav[v]) delete st.fav[v]; else st.fav[v]=1; }
  else if(a==='fav'){ if(st.scr!=='fav'){st.back=st.scr; st.scr='fav';} }
  else if(a==='reset'){Object.assign(st,{scr:1,depopen:true,q:'',ini:'',college:'',dep:'',job:'',sub:'',grade:'',keys:{},worries:{},forms:{},detail:null,all:false,open:false,more:{}});}
  render();
  if(a==='job'){const e2=$('#subsec'); if(e2&&e2.scrollIntoView) try{e2.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(_){}}
});
$('#pn-wireframe').addEventListener('input',e=>{ if(e.target.id!=='depq') return; st.q=e.target.value; $('#deplist').innerHTML=depList(); });
function scrollTop(){try{window.scrollTo(0,0);}catch(e){}}
render();
</script>

</body>
