<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>취업 준비 활동 추천 구조도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 흑백 기본. 색은 와이어프레임의 "프로그램 없음" 경고에만 쓴다. 모서리는 모두 직각. */
:root{--bg:#fff;--ink:#111;--mut:#5c5c5c;--line:#111;--hair:#c9c9c9;--g1:#efefef;--g2:#dedede;--no:#c62828}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#ededed;--mut:#a3a3a3;--line:#ededed;--hair:#4a4a4a;--g1:#222;--g2:#333;--no:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--ink:#ededed;--mut:#a3a3a3;--line:#ededed;--hair:#4a4a4a;--g1:#222;--g2:#333;--no:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:20px;font-weight:700;margin:0}
.tabs{display:flex;gap:0}
.tabs button{font:inherit;font-weight:600;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:8px 18px;cursor:pointer;margin-left:-1.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
figure{margin:0}
.figbox{overflow-x:auto}
.figbox svg{display:block;width:100%;min-width:760px;max-width:980px;height:auto;margin:0 auto}
figcaption{max-width:980px;margin:12px auto 0;font-size:13px;color:var(--mut)}
figcaption b{color:var(--ink)}
svg text{font-family:inherit;fill:var(--ink)}
.bx{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.pr{fill:var(--g1);stroke:var(--line);stroke-width:1.2}
.ln{fill:none;stroke:var(--line);stroke-width:1.2}
.hr{stroke:var(--hair);stroke-width:1}
.ah{fill:var(--line)}
.nobx{fill:var(--bg);stroke:var(--no);stroke-width:1.2;stroke-dasharray:5 4}
.noln{fill:none;stroke:var(--no);stroke-width:1.2;stroke-dasharray:5 4}
.noah{fill:var(--no)}
svg .tno{fill:var(--no)}
.t{font-size:14px;font-weight:600}
.s{font-size:12px}
svg .m{fill:var(--mut)}
.h{font-size:12px;font-weight:700;letter-spacing:.04em}

/* 와이어프레임: PC 화면 1160px 기준. 한 화면에 질문 하나. */
.wfscroll{overflow-x:auto}
.wf{min-width:1160px;min-height:780px;border:1.5px solid var(--line);display:flex;flex-direction:column}
.wfbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 24px;border-bottom:1.5px solid var(--line)}
.wfbar strong{font-size:16px}
.steps{display:flex;gap:0;font-size:13px}
.steps span{padding:5px 16px;border:1.2px solid var(--line);margin-left:-1.2px;color:var(--mut)}
.steps span.done{background:var(--g2);color:var(--ink)}
.steps span.now{background:var(--ink);color:var(--bg);font-weight:700}
.favbtn{justify-self:end;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1.2px solid var(--line);padding:5px 14px;cursor:pointer}
.scr{flex:1;padding:56px 72px 40px;display:flex;flex-direction:column;gap:28px;min-width:0}
.q{font-size:32px;font-weight:700;line-height:1.3;margin:0}
.sub{font-size:16px;color:var(--mut);margin:-16px 0 0}
.grid{display:grid;gap:12px}
.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.tile{font:inherit;font-size:16px;font-weight:500;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile small{font-size:12.5px;font-weight:400;color:var(--mut)}
.tile[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tile[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.tile.big{font-size:24px;font-weight:700;padding:44px 18px;align-items:center;text-align:center}
.tile.dim{border-style:dashed}
.find{font:inherit;font-size:20px;width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:16px 18px;border-radius:0;outline-offset:2px}
.idx{display:flex;flex-wrap:wrap;gap:0}
.idx button{font:inherit;font-size:16px;font-weight:500;min-width:52px;background:var(--bg);color:var(--ink);border:1.2px solid var(--line);margin-left:-1.2px;padding:9px 12px;cursor:pointer}
.idx button:first-child{margin-left:0}
.idx button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.idx button:disabled{color:var(--mut);opacity:.4;cursor:default}
#deplist{display:flex;flex-direction:column;gap:22px}
.gl{font-size:14px;font-weight:700;margin:8px 0 -14px}
.stars{display:flex;gap:2px;margin-top:6px}
.stars span{font-size:22px;line-height:1;opacity:.3;cursor:pointer;padding:0 1px}
.stars span.on{opacity:1}
.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 72px;border-top:1.5px solid var(--line)}
.btn{font:inherit;font-size:17px;font-weight:700;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:14px 44px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:default}
.hint{font-size:14px;color:var(--mut)}
.cond{display:flex;align-items:center;gap:12px;font-size:15px;border:1.2px solid var(--line);padding:12px 16px}
.cond b{flex:1;font-weight:500}
.lk{font:inherit;font-size:14px;background:none;border:0;border-bottom:1px solid var(--ink);color:var(--ink);padding:0;cursor:pointer}
.rows{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.row{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:0;border-bottom:1.2px solid var(--line);display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:8px;padding:20px 8px;cursor:pointer}
.row:hover{background:var(--g1)}
.row .rk{font-size:40px;font-weight:700;line-height:1}
.row .nm{font-size:21px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row .wy{font-size:14.5px;color:var(--mut);margin-top:2px}
.row .go{font-size:15px;white-space:nowrap}
.tag{font-size:12px;font-weight:500;border:1px solid var(--line);padding:1px 7px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{border:1.5px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-size:52px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:15px}
.stat .d{font-size:13.5px;color:var(--mut)}
.bar{height:10px;background:var(--g2);position:relative;margin-top:6px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
details{font-size:14px}
details summary{cursor:pointer;color:var(--mut)}
.calc{margin-top:6px;font-variant-numeric:tabular-nums;border-left:2px solid var(--line);padding-left:10px;line-height:1.8}
.h3{font-size:20px;font-weight:700;margin:8px 0 -12px}
.pl{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.p{display:flex;align-items:center;gap:14px;padding:16px 8px;border-bottom:1.2px solid var(--line)}
.p .pn{flex:1;min-width:0;font-size:16px;font-weight:500}
.p .wh{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:2px}
.p button{font:inherit;font-size:14px;font-weight:600;background:var(--bg);color:var(--ink);border:1.2px solid var(--line);padding:8px 18px;cursor:pointer;flex:none}
.p button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.none{color:var(--no);font-weight:600}
.empty{border:1.5px dashed var(--line);padding:48px 16px;text-align:center;color:var(--mut);font-size:16px}
</style>

<div class="wrap">
  <div class="top">
    <h1>취업 준비 활동 추천</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tb-structure" data-tab="structure" aria-selected="true">구조도</button>
      <button role="tab" id="tb-wireframe" data-tab="wireframe" aria-selected="false">와이어프레임</button>
    </div>
  </div>

  <section id="pn-structure" role="tabpanel">
    <figure>
      <div class="figbox">
      <svg viewBox="0 0 920 770" role="img" aria-label="학과, 희망 직무, 한 활동과 별점으로 GOMS에서 비슷한 선배를 찾고, 활동 순위를 계산한 뒤, 학년과 학과에 맞는 선샤인 프로그램을 붙여 결과 화면으로 보여 준다">
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="ah"/></marker>
          <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" class="noah"/></marker>
        </defs>
        <text x="20" y="24" class="h">입력</text><text x="310" y="24" class="h">추천 계산</text><text x="710" y="24" class="h">데이터</text>

        <rect x="20" y="40" width="190" height="56" class="bx"/><text x="32" y="62" class="s m">학과</text><text x="32" y="83" class="t">서비스디자인공학과</text>
        <rect x="20" y="112" width="190" height="56" class="bx"/><text x="32" y="134" class="s m">희망 직무</text><text x="32" y="155" class="t">예술·디자인·방송직</text>
        <rect x="20" y="184" width="190" height="56" class="bx"/><text x="32" y="206" class="s m">한 활동과 도움 별점</text><text x="32" y="227" class="t">영어 등 외국어 공부 ★4</text>
        <rect x="20" y="424" width="190" height="56" class="bx"/><text x="32" y="446" class="s m">학년</text><text x="32" y="467" class="t">3학년</text>
        <path d="M210 68H260V212H210" class="ln"/>
        <path d="M210 140H308" class="ln" marker-end="url(#a)"/>
        <path d="M210 452H308" class="ln" marker-end="url(#a)"/>

        <rect x="310" y="92" width="300" height="96" class="pr"/>
        <text x="326" y="122" class="t">① 비슷한 선배 찾기</text>
        <text x="326" y="146" class="s">전공 계열·직무가 같은 선배 선별</text>
        <text x="326" y="166" class="s">인원이 적으면 직무 전체로 범위 확대</text>
        <path d="M460 188V246" class="ln" marker-end="url(#a)"/><text x="472" y="222" class="s m">비슷한 선배 집합</text>

        <rect x="310" y="248" width="300" height="96" class="pr"/>
        <text x="326" y="278" class="t">② 활동 순위 계산</text>
        <text x="326" y="302" class="s">도움 점수 + 참여율 차이 + 내 별점 반영</text>
        <text x="326" y="322" class="s">이미 한 활동 제외</text>
        <path d="M460 344V402" class="ln" marker-end="url(#a)"/><text x="472" y="378" class="s m">활동 순위</text>

        <rect x="310" y="404" width="300" height="96" class="pr"/>
        <text x="326" y="434" class="t">③ 프로그램 연결</text>
        <text x="326" y="458" class="s">활동 유형이 같은 선샤인 프로그램 연결</text>
        <text x="326" y="478" class="s">내 학과·학년에 맞는 프로그램 우선 표시</text>
        <path d="M460 500V546" class="ln" marker-end="url(#a)"/>

        <rect x="710" y="92" width="190" height="252" class="bx"/>
        <text x="722" y="122" class="t">GOMS 2019</text>
        <text x="722" y="146" class="s">4년제 졸업생 14,013명</text>
        <path d="M722 160H888" class="hr"/>
        <text x="722" y="184" class="s m">전공 계열</text>
        <text x="722" y="204" class="s m">현재 직업</text>
        <text x="722" y="224" class="s m">활동별 참여 여부</text>
        <text x="722" y="244" class="s m">활동별 도움 점수 (1~5)</text>
        <path d="M710 140H612" class="ln" marker-end="url(#a)"/>
        <path d="M710 296H612" class="ln" marker-end="url(#a)"/>

        <rect x="710" y="404" width="190" height="96" class="bx"/><text x="722" y="434" class="t">선샤인 프로그램 269개</text>
        <text x="722" y="458" class="s">성신여자대학교 진로·취업 시스템</text>
        <text x="722" y="478" class="s m">활동 유형, 대상 학과, 대상 학년</text>
        <path d="M710 452H612" class="ln" marker-end="url(#a)"/>

        <text x="20" y="566" class="h">출력</text>
        <rect x="20" y="582" width="28" height="14" class="pr"/><text x="58" y="594" class="s">계산 단계</text>
        <rect x="20" y="608" width="28" height="14" class="bx"/><text x="58" y="620" class="s">입력 · 데이터 · 출력</text>

        <rect x="310" y="548" width="590" height="206" class="bx"/>
        <text x="326" y="572" class="s m">결과 화면 (입력 예시와 같은 조건으로 계산한 값)</text>
        <path d="M310 584H900" class="ln"/>
        <g id="figrows"></g>
      </svg>
      </div>
      <figcaption><b>그림 1.</b> 취업 준비 활동 추천의 구조. 입력 4개 중 3개는 비슷한 선배 찾기에, 학년은 프로그램 선택에 사용. 결과 화면의 숫자는 2019GOMS 값, 프로그램명은 선샤인 목록의 이름.</figcaption>
    </figure>
  </section>

  <section id="pn-wireframe" role="tabpanel" hidden>
    <div class="wfscroll">
      <div class="wf">
        <div class="wfbar"><strong>취업 준비 활동 추천</strong><div class="steps" id="steps"></div><button type="button" class="favbtn" data-a="fav" id="favbtn"></button></div>
        <div class="scr" id="scr"></div>
        <div class="nav" id="nav"></div>
      </div>
    </div>
  </section>

const ROAD={'1학년':['직업심리검사','진로 상담','진로·취업 교과목','진로·취업 특강','봉사활동'],

'3학년':['진로 상담','진로·취업 교과목','직무 교육·훈련','취업캠프·스터디','영어 등 외국어 공부','직장체험(인턴 포함)','기업체 직무적성검사 준비'],

'졸업생':[]};
const EXTRA=['진로·취업 특강','선배·현직자 만남','직무 교육·훈련','기타 온라인 강의·도구·인증'];
const K=20, W_RATE=2, W_STAR=0.5, W_ROAD=0.2;

function recommend(q){
  const dp=D.dep.find(x=>x[1]===q.dep), major=dp?dp[2]:null, job=q.job&&q.job!=='?'?q.job:null;
  const chain=[]; if(job){chain.push('J:'+job); if(major)chain.push('JM:'+job+'|'+major);} else if(major) chain.push('M:'+major);
  const excluded=new Set(); Object.keys(q.done).forEach(i=>IN[i][3].forEach(t=>excluded.add(t)));
  const rated=Object.entries(q.done).filter(([i,r])=>r>0&&IN[i][2]);
  const out=[], skipped=[];
  let grp=D.stat.A, grpName='4년제 졸업생 전체';
  chain.forEach(k=>{const s=D.stat[k]; if(s&&s[D.res[9]][0]>=30){grp=s; grpName=k.startsWith('JM:')?major+' 계열 · '+job:k.startsWith('J:')?job:major+' 계열';}});
  const grpN=grp[D.res[9]][0];
  D.res.forEach(t=>{
    if(excluded.has(t)) return;
    const A=D.stat.A[t], rAll=A[1]/A[0];
    if(t==='어학연수'){skipped.push({t,why:'GOMS에 도움 점수가 없어 순위를 낼 수 없음'});return;}
    let h=A[2]/A[1], r=rAll;
    chain.forEach(k=>{const s=D.stat[k]&&D.stat[k][t]; if(s){r=(s[1]+K*r)/(s[0]+K); h=(s[2]+K*h)/(s[1]+K);}});
    const g=grp[t], rawRate=g[0]?g[1]/g[0]:0, rawHelp=g[1]?g[2]/g[1]:null;
    let num=0, den=0;
    rated.forEach(([i,rt])=>{const c=IN[i][2], s=(D.sim[c]||{})[t]; if(s){num+=s*(rt-D.mean[c]); den++;}});
    const star=den?num/den:0, road=(ROAD[q.grade]||[]).includes(t);
    const score=h+W_RATE*(r-rAll)+W_STAR*star+(road?W_ROAD:0);
    out.push({t,score,h,r,rAll,rawRate,rawHelp,den:g[0],n:g[1],star,road});
  });
  out.sort((a,b)=>b.score-a.score);
  return {list:out,skipped,grpName,grpN,major,job,dp};
}
const norm=s=>s.replace(/[·\s]/g,'').replace(/\(.*\)/,'');
function programs(t,q){
  const dp=D.dep.find(x=>x[1]===q.dep), mine=[], gen=[]; let other=0;
  D.prog.forEach(p=>{
    if(p.t!==t) return;
    const grad=p.area==='졸업생 특화프로그램';
    if(grad&&q.grade!=='졸업생'){other++;return;}
    if(!p.d){(grad?mine:gen).push(p);return;}
    const pd=norm(p.d);
    if(dp&&(pd.includes(norm(dp[1]))||pd===norm(dp[0]))) mine.push(p); else other++;
  });
  return {list:mine.concat(gen),mine:mine.length,other};
}
const pct=x=>Math.round(x*100)+'%';

const STEPS=['학과','희망 직무','학년','한 활동','추천 결과'];
const st={scr:1,back:'rank',q:'',ini:'',college:'',dep:'',job:'',grade:'',done:{},fav:{},detail:null,all:false,open:false};
const CHO='ㄱㄱㄴㄷㄷㄹㅁㅂㅂㅅㅅㅇㅈㅈㅊㅋㅌㅍㅎ', INI=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','A-Z'];
function cho(s){return [...s].map(ch=>{const c=ch.charCodeAt(0);return c>=0xAC00&&c<=0xD7A3?CHO[Math.floor((c-0xAC00)/588)]:ch;}).join('');}
const DEPS=D.dep.map(d=>{const c=cho(d[1]);return {col:d[0],name:d[1],cho:c.replace(/[^ㄱ-ㅎA-Za-z]/g,''),ini:/[ㄱ-ㅎ]/.test(c[0])?c[0]:'A-Z'};}).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
function depList(){
  const q=st.q.replace(/\s/g,''), onlyCho=q&&/^[ㄱ-ㅎ]+$/.test(q);
  const hit=DEPS.filter(d=>q?(onlyCho?d.cho.includes(q.replace(/[ㄲㄸㅃㅆㅉ]/g,m=>({'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'}[m]))):d.name.replace(/\s/g,'').toLowerCase().includes(q.toLowerCase())):(!st.ini||d.ini===st.ini));
  if(!hit.length) return '<div class="hint">"'+esc(st.q)+'"에 맞는 학과가 없어요. 다른 이름으로 검색해 보세요.</div>';
  const tile=d=>'<button type="button" class="tile" data-a="dep" data-v="'+esc(d.name)+'" aria-pressed="'+(st.dep===d.name)+'">'+esc(d.name)+'<small>'+esc(d.col)+'</small></button>';
  if(q) return '<div class="grid c4">'+hit.map(tile).join('')+'</div>';
  return INI.filter(c=>hit.some(d=>d.ini===c)).map(c=>'<div><div class="gl" style="margin:0 0 10px">'+c+'</div><div class="grid c4">'+hit.filter(d=>d.ini===c).map(tile).join('')+'</div></div>').join('');
}

      '<div class="rows">'+list.map((a,i)=>{const P=programs(a.t,st);return '<button type="button" class="row" data-a="detail" data-v="'+esc(a.t)+'"><span class="rk">'+(i+1)+'</span><span><span class="nm">'+esc(a.t)+(a.road?'<span class="tag">'+st.grade+' 로드맵 권장</span>':'')+'</span><span class="wy">비슷한 선배 '+pct(a.rawRate)+'가 했어요 · 도움 점수 '+(a.rawHelp?a.rawHelp.toFixed(2):'-')+'점</span></span><span class="go">'+(P.list.length?'선샤인 프로그램 '+P.list.length+'개 ›':'<span class="none">프로그램 없음</span> ›')+'</span></button>';}).join('')+'</div>';
    if(R.list.length>5) h+='<div><button type="button" class="lk" data-a="all">'+(st.all?'5위까지만 보기':(R.list.length)+'위까지 모두 보기')+'</button></div>';
    h+='<div class="h3">선배 데이터에는 없지만 선샤인에 있는 활동</div><div class="rows">'+EXTRA.map(t=>{const P=programs(t,st);return '<button type="button" class="row" data-a="detail" data-v="'+esc(t)+'"><span class="rk">–</span><span><span class="nm">'+esc(t)+((ROAD[st.grade]||[]).includes(t)?'<span class="tag">'+st.grade+' 로드맵 권장</span>':'')+'</span><span class="wy">선배 설문에 없는 활동이라 순위를 매기지 않았어요</span></span><span class="go">선샤인 프로그램 '+P.list.length+'개 ›</span></button>';}).join('')+'</div>';
    if(R.skipped.length) h+='<div class="hint">순위에 넣지 못한 활동: '+R.skipped.map(x=>esc(x.t)+' ('+esc(x.why)+')').join(', ')+'</div>';
    nav='<button type="button" class="btn" data-a="go" data-v="4">이전</button><span class="hint">활동을 누르면 프로그램이 나와요</span><button type="button" class="btn" data-a="reset">처음부터 다시</button>';
  } else if(st.scr==='detail'){
    const R=recommend(st), idx=R.list.findIndex(a=>a.t===st.detail), a=R.list[idx], P=programs(st.detail,st);
    h='<div><button type="button" class="lk" data-a="go" data-v="rank">‹ 순위로 돌아가기</button></div><h2 class="q">'+(a?(idx+1)+'위  ':'')+esc(st.detail)+'</h2>';
    if(a){
      const max=Math.max(a.rawRate,a.rAll,.01)*1.15;
      h+='<div class="stat2"><div class="stat"><span class="n">'+pct(a.rawRate)+'</span><span class="l">비슷한 선배가 이 활동을 했어요</span><div class="bar"><i style="width:'+(a.rawRate/max*100)+'%"></i><u style="left:'+(a.rAll/max*100)+'%"></u></div><span class="d">'+esc(R.grpName)+' '+a.den.toLocaleString()+'명 중 '+a.n.toLocaleString()+'명 · 세로선은 전체 선배 '+pct(a.rAll)+'</span></div>'+
        '<div class="stat"><span class="n">'+(a.rawHelp?a.rawHelp.toFixed(2):'-')+'</span><span class="l">도움 점수 (5점 만점)</span><div class="bar"><i style="width:'+((a.rawHelp||0)/5*100)+'%"></i></div><span class="d">이 활동을 한 선배 '+a.n.toLocaleString()+'명이 준 점수의 평균</span></div></div>'+
        '<details><summary>추천 점수 계산 보기 ('+a.score.toFixed(2)+')</summary><div class="calc">도움 점수 '+a.h.toFixed(2)+' (인원이 적으면 전체 평균 쪽으로 보정)<br>참여율 차이 '+(W_RATE*(a.r-a.rAll)>=0?'+':'')+(W_RATE*(a.r-a.rAll)).toFixed(2)+' (비슷한 선배 '+pct(a.r)+' − 전체 '+pct(a.rAll)+', × '+W_RATE+')<br>내 별점 반영 '+(W_STAR*a.star>=0?'+':'')+(W_STAR*a.star).toFixed(2)+' (내가 별점 준 활동과 도움 점수가 같이 움직이는 정도)<br>학년 로드맵 '+(a.road?'+'+W_ROAD.toFixed(2):'+0.00')+'</div></details>';
    } else h+='<p class="sub">선배 설문에 없는 활동이에요. 선샤인 프로그램만 보여 줘요.</p>';
    h+='<div class="h3">선샤인 프로그램 '+P.list.length+'개</div>'+progRows(st.detail);
    nav='<button type="button" class="btn" data-a="go" data-v="rank">순위로</button><span></span><span></span>';
  } else if(st.scr==='fav'){
    const ids=Object.keys(st.fav);
    h='<h2 class="q">관심 프로그램 '+ids.length+'개</h2>'+(ids.length?'<div class="pl">'+ids.map(id=>{const p=D.prog.find(x=>x.i==id);return '<div class="p"><span class="pn">'+esc(p.n)+'<span class="wh">'+esc(p.t)+' · 선샤인 메뉴: '+esc(p.tab)+'</span></span><button type="button" data-a="favtoggle" data-v="'+p.i+'" aria-pressed="true">관심 ✓</button></div>';}).join('')+'</div>':'<div class="empty">프로그램에서 "관심"을 누르면 여기에 모여요.</div>');
    nav='<button type="button" class="btn" data-a="go" data-v="'+st.back+'">돌아가기</button><span></span><span></span>';
  }
  $('#scr').innerHTML=h; $('#nav').innerHTML=nav;
}
$('#pn-wireframe').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='ini'){st.ini=v==='전체'?'':v; st.q='';}
  else if(a==='dep') st.dep=v;
  else if(a==='job') st.job=v;
  else if(a==='grade') st.grade=v;
  else if(a==='star'){e.stopPropagation(); const n=+b.dataset.n; st.done[v]=st.done[v]===n?0:n;}
  else if(a==='act'){ if(v in st.done) delete st.done[v]; else st.done[v]=0; }
  else if(a==='go'){st.scr=/^\d+$/.test(v)?+v:v; st.open=false; scrollTop();}
  else if(a==='detail'){st.detail=v; st.scr='detail'; st.open=false; scrollTop();}
  else if(a==='all') st.all=!st.all;
  else if(a==='open') st.open=!st.open;
  else if(a==='favtoggle'){ if(st.fav[v]) delete st.fav[v]; else st.fav[v]=1; }
  else if(a==='fav'){ if(st.scr!=='fav'){st.back=st.scr; st.scr='fav';} }
  else if(a==='reset'){Object.assign(st,{scr:1,q:'',ini:'',college:'',dep:'',job:'',grade:'',done:{},detail:null,all:false,open:false});}
  render();
});
$('#pn-wireframe').addEventListener('input',e=>{ if(e.target.id!=='depq') return; st.q=e.target.value; if(st.q) st.ini=''; $('#deplist').innerHTML=depList(); });
function scrollTop(){try{$('.wf').scrollIntoView({block:'start'});}catch(e){}}
render();
</script>
